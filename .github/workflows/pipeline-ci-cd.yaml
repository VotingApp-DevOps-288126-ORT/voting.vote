# .github/workflows/pipeline.yml
name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "test", "prod" ]
  pull_request:
    branches: [ "dev", "test", "prod" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_CHANGED_FILES_ONLY: true
          VALIDATE_ALL_CODEBASE: false
          IGNORE_GITIGNORED_FILES: true
          IGNORE_DUPLICATION: true

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        with:
          args:
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          projectBaseDir: .

  build-and-push:
    name: Build & Push Docker Image to ECR
    needs: sonarcloud
    if: ${{ github.event_name == 'push' }}
    uses: VotingApp-DevOps-288126-ORT/voting.infra/.github/workflows/build-push-docker-image.yaml@prod
    with:
      tag: ${{ github.sha }}-${{ github.ref_name }}
    secrets: inherit

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: ${{ github.event_name == 'push' }}
    uses: VotingApp-DevOps-288126-ORT/voting.infra/.github/workflows/deploy-to-k8.yaml@prod
    with:
      cluster_name: cluster-eks-${{ github.ref_name }}  
      manifest_path: ./k8s-specifications/vote-deployment.yaml                        
      environment: ${{ github.ref_name }}                      
      commit_sha: ${{ github.sha }} 
    secrets: inherit

  test-endpoint:
    name: Run Postman Tests
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}
          
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cluster-eks-${{ github.ref_name }} --region ${{ secrets.AWS_REGION }}

      - name: Get LB Address and Run Postman Tests
        run: |
          newman run postman/postman_collection.json \
            --env-var "baseUrl=$(kubectl get services vote-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')" \
            --delay-request 500 \
            --timeout-request 10000 \
            --bail

  notify:
    name: Send deployment notification via Gmail
    needs: test-endpoint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Build email body
        id: build_email
        run: |
          APP="vote"
          ENV="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "✅ Deploy de *${APP}* completado en *${ENV}*"
            echo
            echo "🔖 Commit: \`${COMMIT}\`"
            echo "📅 Fecha: ${DATE}"
            echo
            echo "¡Saludos!"
          } > email_body.txt

          # Exponer el cuerpo como salida
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat email_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email via Gmail SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER_ADDRESS }}
          server_port:    ${{ secrets.SMTP_SERVER_PORT }}
          secure:         true
          username:       ${{ secrets.GMAIL_USERNAME }}
          password:       ${{ secrets.GMAIL_APP_PASSWORD }}
          from:           ${{ secrets.GMAIL_USERNAME }}
          to:             ${{ secrets.EMAIL_RECIPIENTS }}
          subject:        "✅ Deploy de vote a ${{ github.ref_name }} exitoso"
          body:           ${{ steps.build_email.outputs.body }}

