apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: __AWS_ACCOUNT_ID__.dkr.ecr.us-east-1.amazonaws.com/voting_vote:__IMAGE_TAG__
        name: vote
        ports:
        - containerPort: 80
          name: vote
